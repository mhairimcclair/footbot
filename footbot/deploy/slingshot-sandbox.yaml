# Slingshot GitOps deployment — SANDBOX
# Points at the sandbox Slack channel for testing before going live.
#
# Prerequisites:
#   1. cells-onboarding PR merged (deploy/onboarding.yaml)
#   2. Docker image pushed to the Skyscanner registry:
#        docker build -t <REGISTRY>/<YOUR-AWS-PROJECT>/footbot:<TAG> .
#        docker push <REGISTRY>/<YOUR-AWS-PROJECT>/footbot:<TAG>
#   3. Sandbox secrets stored in CredStash:
#        credstash -r eu-west-1 -t <YOUR-AWS-PROJECT> put footbot-sandbox.slack-bot-token  "xoxb-..."
#        credstash -r eu-west-1 -t <YOUR-AWS-PROJECT> put footbot-sandbox.slack-app-token  "xapp-..."
#        credstash -r eu-west-1 -t <YOUR-AWS-PROJECT> put footbot-sandbox.football-data-token "..."
#   4. IAM role with CredStash read permissions (ask #engineering-support)
---
version: '1'
serviceName: footbot
componentName: footbot
serviceType: gitops-cells

accounts:
  - name: cells-1

cells:
  - cells-1-eu-west-1a-1

regions:
  - eu-west-1

charts:
  - name: cells-service-deployment
    version: LATEST                    # pin to a specific version once you've confirmed it works

values:
  cells-service-deployment:
    deployment:
      replicaCount: 1

      image:
        repository: <REGISTRY>/<YOUR-AWS-PROJECT>/footbot   # replace with your image path
        tag: latest                                          # or a pinned SHA/semver tag

      env:
        - name: SLACK_CHANNEL
          value: "C0B67RJ7U48"                  # Sandbox Slack channel

        # Optional overrides — defaults come from config.py
        - name: FOOTBALL_DATA_TIER
          value: "free"                                      # or "paid" if you upgrade
        - name: MATCHDAY_SUMMARY_HOUR
          value: "5"
        - name: MATCHDAY_SUMMARY_MINUTE
          value: "0"

      # Secrets injected from CredStash at pod startup via mshell-secrets sidecar.
      # Key names must match what you stored in CredStash above.
      secrets:
        - envVar: SLACK_BOT_TOKEN
          credstashKey: footbot-sandbox.slack-bot-token
        - envVar: SLACK_APP_TOKEN
          credstashKey: footbot-sandbox.slack-app-token
        - envVar: FOOTBALL_DATA_TOKEN
          credstashKey: footbot-sandbox.football-data-token

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 256Mi

      # Footbot doesn't expose HTTP — disable the default liveness/readiness probes.
      livenessProbe:
        enabled: false
      readinessProbe:
        enabled: false

    # No ingress needed — Socket Mode is outbound-only.
    service:
      enabled: false
